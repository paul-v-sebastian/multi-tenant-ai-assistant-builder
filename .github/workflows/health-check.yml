name: Health Check

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy"]
    types:
      - completed

permissions: {}

jobs:
  health-check:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: test

    steps:
      - name: Check app URL is configured
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::warning::Repository variable STREAMLIT_APP_URL is not set; skipping health check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        id: check_url

      - name: Check deployed app
        if: steps.check_url.outputs.skip != 'true'
        env:
          APP_URL: ${{ vars.STREAMLIT_APP_URL }}
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl --fail --show-error --silent \
            --retry 5 \
            --retry-connrefused \
            --retry-delay 5 \
            "$APP_URL" > "$response_file"
          grep -q "PDF RAG Chatbot" "$response_file"
